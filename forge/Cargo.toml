[package]
name = "forge"
version = "0.1.0"
edition = "2024"

[dependencies]
# The change log's wire format and the checkpoint file. FORGE mirrors PRISM's
# envelope instead of depending on the prism crate: they share only a file.
serde.workspace = true
serde_json.workspace = true
# Fingerprint of the change log's first line, to recognise a replaced file.
sha2.workspace = true
# Webhook signatures: HMAC-SHA256, hex-encoded.
hmac.workspace = true
hex.workspace = true
thiserror.workspace = true
tracing.workspace = true
url.workspace = true
# LENS client: HTTP, error classification, and the visibility gate's sleeps.
reqwest.workspace = true
hyper.workspace = true
# The webhook dispatcher also needs a background task, its wake signal and
# `select!`; the API and the binary a multi-threaded runtime, a listener and
# the shutdown signals.
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "sync", "macros", "net", "signal"] }
# Registry: saved queries, alerts and the webhook outbox in one SQLite file,
# so an alert's progress and its outbox row commit in one transaction.
rusqlite.workspace = true
uuid.workspace = true
# Alert engine: `LensApi` is used as `Arc<dyn LensApi>`, which needs boxed
# async methods; shutdown is a `CancellationToken`.
async-trait.workspace = true
tokio-util.workspace = true
# HTTP API: the router, a whole-request timeout, and request tracing; the
# binary's log output.
axum.workspace = true
tower = { workspace = true, features = ["timeout"] }
tower-http = { workspace = true, features = ["trace"] }
tracing-subscriber.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "net", "io-util", "sync"] }
# Drive the API router in-process in the API tests.
tower = { workspace = true, features = ["util"] }
http-body-util.workspace = true
# The LENS client tests run a scripted fake LENS on a raw socket, and the
# contract suite runs the real LENS over Parquet files PRISM's writer made.
lens = { path = "../lens" }
prism = { path = "../prism" }
