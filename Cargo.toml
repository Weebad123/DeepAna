[workspace]
resolver = "3"
members = ["lens",
    "prism",
]


[workspace.dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

# Solana
# 4.3.0, not newer: the helius SDK pins solana-client, solana-account-decoder
# and the transaction-status types to exactly =4.3.0.
solana-client = "4.3.0"
solana-sdk = "4.1.0"
# Without `agave-unstable-api` this crate compiles to nothing (the whole lib is
# gated on it), so none of its block / transaction types would be importable.
solana-transaction-status = { version = "4.3.0", features = ["agave-unstable-api"] }
solana-account-decoder = "4.3.0"
# Tests only: `solana_sdk::transaction` is a deprecated re-export.
solana-transaction = "4.3.0"
anchor-lang = "1.2.1"
# Anchor >= 0.30 IDL types (instructions carry explicit discriminators).
anchor-lang-idl-spec = "0.1.0"
borsh = "1.8.1"

# SPL
spl-token = { version = "9.0.0", features = ["no-entrypoint"] }
spl-token-2022 = { version = "11.1.0", features = ["no-entrypoint"] }
# `spl_token::instruction` and `spl_token_2022::instruction` are deprecated
# re-exports of these two.
spl-token-interface = "2.0.0"
spl-token-2022-interface = "3.1.2"
spl-associated-token-account = { version = "8.0.0", features = ["no-entrypoint"] }

# Arrow / Parquet
arrow = "60.0.0"
parquet = "60.0.0"
arrow-schema = "60.0.0"

# Query engine (LENS)
# 55.2 is built on arrow/parquet 59, not the 60 above. LENS only ever uses
# the copies DataFusion re-exports (`datafusion::arrow`, `datafusion::parquet`)
# so its Arrow types always match the engine's.
datafusion = "55.2.0"
url = "2.5.8"

# Utilities
chrono = "0.4.45"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
thiserror = "2.0.21"
backoff = "0.4.0"
dashmap = "6.2.1"
bs58 = "0.5.1"
base64 = "0.22.1"
bytes = "1.12.1"
sha2 = "0.10.9"
flate2 = "1.1.10"

# Async
tokio = { version = "1.53.3", features = ["time"] }
tokio-util = "0.7.20"
async-trait = "0.1.92"
governor = { version = "0.10.4", default-features = false, features = ["std"] }
