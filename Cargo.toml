[workspace]
resolver = "3"
members = [
    "prism"
]


[workspace.dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

# Solana
solana-client = "4.3.2"
solana-sdk = "4.1.0"
solana-transaction-status = "4.3.2"
solana-account-decoder = "4.3.2"
anchor-lang = "1.2.1"
borsh = "1.8.1"

# SPL
spl-token = "9.0.0"
spl-token-2022 = "11.1.0"
spl-associated-token-account = "8.0.0"

# Arrow / Parquet
arrow = "60.0.0"
parquet = "60.0.0"
arrow-schema = "60.0.0"

# Utilities
chrono = "0.4.45"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
thiserror = "2.0.21"
backoff = "0.4.0"
dashmap = "6.2.1"
bs58 = "0.5.1"
