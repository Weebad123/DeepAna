[workspace]
resolver = "3"
members = [
    "prism"
]


[workspace.dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

# Solana
solana-client = "4.3.2"
solana-sdk = "4.1.0"
# Without `agave-unstable-api` this crate compiles to nothing (the whole lib is
# gated on it), so none of its block / transaction types would be importable.
solana-transaction-status = { version = "4.3.2", features = ["agave-unstable-api"] }
solana-account-decoder = "4.3.2"
anchor-lang = "1.2.1"
borsh = "1.8.1"

# SPL
spl-token = { version = "9.0.0", features = ["no-entrypoint"] }
spl-token-2022 = { version = "11.1.0", features = ["no-entrypoint"] }
spl-associated-token-account = { version = "8.0.0", features = ["no-entrypoint"] }

# Arrow / Parquet
arrow = "60.0.0"
parquet = "60.0.0"
arrow-schema = "60.0.0"

# Utilities
chrono = "0.4.45"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
thiserror = "2.0.21"
backoff = "0.4.0"
dashmap = "6.2.1"
bs58 = "0.5.1"
bytes = "1.12.1"

# Async
tokio = { version = "1.53.3", features = ["time"] }
tokio-util = "0.7.20"
async-trait = "0.1.92"
governor = { version = "0.10.4", default-features = false, features = ["std"] }
