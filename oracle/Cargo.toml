[package]
name = "oracle"
version = "0.1.0"
edition = "2024"

[dependencies]
thiserror.workspace = true
# `OracleConfig::display` logs the effective config; the host installs the
# subscriber.
tracing.workspace = true
# `lens_url` validation and normalization.
url.workspace = true
# Store: anomalies, detector progress and digests in one SQLite file, so a
# scan's anomalies and its progress commit in one transaction.
rusqlite.workspace = true
# Store row types are serialised by the API; anomaly details and digest
# bodies are stored as JSON.
serde.workspace = true
serde_json.workspace = true
# LENS is ORACLE's only data source; ORACLE talks to it through FORGE's
# `lens_client` module, so both share one wire format and error classification.
forge = { path = "../forge" }
# Detectors: `Detector` and `LensApi` are used as trait objects, which needs
# boxed async methods. The runner: its task, sleeps, `select!`, the blocking
# pool for store commits, and its `CancellationToken`.
async-trait.workspace = true
tokio = { workspace = true, features = ["rt", "sync", "time", "macros"] }
tokio-util.workspace = true

[dev-dependencies]
# Capture `OracleConfig::display` output in the config tests.
tracing-subscriber.workspace = true
# The detect tests drive the runner on a real runtime, against a scripted
# LENS and against the real LENS over Parquet files PRISM's writer made.
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "net", "sync", "time", "test-util"] }
lens = { path = "../lens" }
prism = { path = "../prism" }
