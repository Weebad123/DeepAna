[package]
name = "oracle"
version = "0.1.0"
edition = "2024"

[dependencies]
thiserror.workspace = true
# `OracleConfig::display` logs the effective config; the host installs the
# subscriber.
tracing.workspace = true
# `lens_url` validation and normalization.
url.workspace = true
# Store: anomalies, detector progress and digests in one SQLite file, so a
# scan's anomalies and its progress commit in one transaction.
rusqlite.workspace = true
# Store row types are serialised by the API; anomaly details and digest
# bodies are stored as JSON.
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
# Capture `OracleConfig::display` output in the config tests.
tracing-subscriber.workspace = true
