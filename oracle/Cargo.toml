[package]
name = "oracle"
version = "0.1.0"
edition = "2024"

[dependencies]
thiserror.workspace = true
# `OracleConfig::display` logs the effective config; the host installs the
# subscriber.
tracing.workspace = true
# `lens_url` validation and normalization.
url.workspace = true
# Store: anomalies, detector progress and digests in one SQLite file, so a
# scan's anomalies and its progress commit in one transaction.
rusqlite.workspace = true
# Store row types are serialised by the API; anomaly details and digest
# bodies are stored as JSON.
serde.workspace = true
serde_json.workspace = true
# LENS is ORACLE's only data source; ORACLE talks to it through FORGE's
# `lens_client` module, so both share one wire format and error classification.
forge = { path = "../forge" }
# Detectors: `Detector` and `LensApi` are used as trait objects, which needs
# boxed async methods. The runner: its task, sleeps, `select!`, the blocking
# pool for store commits, and its `CancellationToken`. The binary: a
# multi-threaded runtime, its listener and the shutdown signals.
async-trait.workspace = true
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "sync", "time", "macros", "net", "signal"] }
tokio-util.workspace = true
# `profile/`: an id must decode to exactly 32 bytes.
bs58.workspace = true
# `spec/`: every compiled statement is parsed before it is sent, to prove it
# is exactly one SELECT over one table.
sqlparser.workspace = true
# `api/`: the HTTP surface. `catch-panic` turns a handler panic into a 500;
# request ids are UUID v4.
axum.workspace = true
tower-http = { workspace = true, features = ["catch-panic"] }
uuid.workspace = true
# The binary's log output. The library itself never installs a subscriber.
tracing-subscriber.workspace = true

[dev-dependencies]
# `api_test` drives the router in-process with `oneshot` and reads bodies.
tower = { workspace = true, features = ["util"] }
http-body-util.workspace = true
# The detect tests drive the runner on a real runtime, against a scripted
# LENS and against the real LENS over Parquet files PRISM's writer made.
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "net", "io-util", "sync", "time", "test-util"] }
lens = { path = "../lens" }
prism = { path = "../prism" }
# `catalog_prism_test` reads the footers of the Parquet files PRISM's writer
# makes and compares their Arrow schemas with the catalog's.
parquet.workspace = true
arrow-schema.workspace = true
# `catalog_test` checks the built-in entities' addresses against the SDK's
# own constants. All already in the build through PRISM.
solana-sdk-ids = "3.1.0"
spl-token-interface.workspace = true
spl-token-2022-interface.workspace = true
spl-associated-token-account-interface = "2.0.0"
spl-memo-interface = "2.1.0"
