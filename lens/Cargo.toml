[package]
name = "lens"
version = "0.1.0"
edition = "2024"

[dependencies]
async-trait.workspace = true
axum.workspace = true
datafusion.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "sync", "net", "signal"] }
tokio-util.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
serde.workspace = true
serde_json.workspace = true
url.workspace = true

[dev-dependencies]
# Writes the Parquet files LENS reads in the catalog tests, so they exercise
# PRISM's real output rather than a copy of it.
prism = { path = "../prism" }
arrow.workspace = true
chrono.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "test-util", "io-util"] }
# Drive the router in-process in the API tests.
tower = { workspace = true, features = ["util"] }
http-body-util.workspace = true
